<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12100e">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Trust Page — Quét mã, hiểu tượng</title>
<meta name="description" content="Quét mã QR bên cạnh tượng để xem video thuyết minh và tìm hiểu về từng vị Phật, Bồ Tát.">
<meta property="og:title" content="Trust Page — Quét mã, hiểu tượng">
<meta property="og:description" content="Quét mã QR bên cạnh tượng để xem video thuyết minh và tìm hiểu về từng vị Phật, Bồ Tát.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://trustpage.info/">
<style>
  :root{
    --bg:#12100e; --card:#1c1916; --fg:#f2ece3; --dim:#a09789;
    --gold:#c9a227; --line:#2a2420;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--fg);
    font:16px/1.65 -apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",sans-serif;
    display:flex; flex-direction:column; height:100dvh; overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  header{
    padding:calc(env(safe-area-inset-top) + 13px) 20px 11px;
    border-bottom:1px solid var(--line); flex:none;
  }
  header h1{margin:0; font-size:18px; font-weight:600}
  header p{margin:2px 0 0; font-size:13px; color:var(--dim)}

  main{flex:1; position:relative; min-height:0}
  .panel{position:absolute; inset:0; display:none; overflow-y:auto;
         -webkit-overflow-scrolling:touch; padding:22px 20px 32px}
  .panel.on{display:block}
  .inner{max-width:640px; margin:0 auto}   /* trên tablet/desktop khỏi dài quá tầm mắt */
  .empty{color:var(--dim); text-align:center; padding:56px 24px}

  /* ---- khối nội dung dùng chung cho tab Giới thiệu và tab Chùa ---- */
  .sec{margin-bottom:30px}
  .sec h2{margin:0 0 10px; font-size:13px; font-weight:700; color:var(--gold);
          text-transform:uppercase; letter-spacing:1.1px}
  .sec p{margin:0 0 12px; color:#e2d9cc}
  .sec p:last-child{margin-bottom:0}
  .sec ul{margin:0 0 12px; padding:0; list-style:none}
  .sec li{position:relative; padding-left:17px; margin-bottom:8px; color:#e2d9cc}
  .sec li::before{content:"·"; position:absolute; left:4px; color:var(--gold); font-weight:700}
  .sec li b{color:var(--fg)}
  blockquote{
    margin:0 0 14px; padding:13px 0 13px 17px;
    border-left:2px solid var(--gold);
    font-size:17px; line-height:1.7; color:#f0e6d6;
  }
  blockquote i{display:block; margin-top:9px; font-size:15px; color:var(--dim); font-style:normal}

  /* ---- tab 1: quét ---- */
  #pScan{padding:0; background:#000}
  #pScan.on{display:flex; flex-direction:column}
  #camWrap{flex:1; position:relative; overflow:hidden; min-height:0}
  #cam{width:100%; height:100%; object-fit:cover; display:block}
  #frame{position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
         width:64vw; height:64vw; max-width:300px; max-height:300px;
         border:2px solid var(--gold); border-radius:18px;
         box-shadow:0 0 0 100vmax rgba(0,0,0,.45)}
  #scanMsg{flex:none; padding:14px 20px calc(14px + env(safe-area-inset-bottom, 0px));
           text-align:center; font-size:14px; color:var(--dim); background:#000}
  #scanMsg b{color:var(--gold); display:block; font-size:15px; margin-bottom:3px}

  /* ---- tab 2: giới thiệu ---- */
  #pIntro{padding:0}
  .ihead{padding:20px 20px 15px}
  .ihead b{display:block; font-size:22px; font-weight:600; line-height:1.3}
  .ihead span{color:var(--dim); font-size:14px}
  video{width:100%; max-height:56vh; object-fit:contain; background:#000; display:block}
  #introBody{padding:26px 20px 34px}

  /* ---- tab 3: lịch sử ---- */
  .item{display:block; width:100%; text-align:left; font:inherit; color:inherit;
        background:var(--card); border:1px solid var(--line); border-radius:12px;
        padding:14px 16px; margin-bottom:10px; cursor:pointer}
  .item b{display:block; font-size:16px}
  .item span{color:var(--dim); font-size:13px}
  .item time{color:#6f665a; font-size:12px; display:block; margin-top:4px}

  /* ---- tab 4: chùa ---- */
  .card{background:var(--card); border:1px solid var(--line);
        border-radius:14px; padding:18px; margin-bottom:28px}
  .card b{display:block; font-size:18px; margin-bottom:4px}
  .card span{color:var(--dim); font-size:14px}
  .card a{display:block; margin-top:16px; padding:12px; text-align:center;
          background:var(--gold); color:#12100e; font-weight:600;
          border-radius:10px; text-decoration:none}

  /* ---- tab bar ---- */
  nav{flex:none; display:flex; border-top:1px solid var(--line);
      background:rgba(18,16,14,.94); backdrop-filter:blur(12px);
      padding-bottom:env(safe-area-inset-bottom)}
  nav button{flex:1; background:none; border:0; cursor:pointer;
             display:flex; flex-direction:column; align-items:center; gap:3px;
             padding:9px 0 7px; color:var(--dim); font-size:10.5px;
             font-family:inherit; -webkit-tap-highlight-color:transparent}
  nav button.on{color:var(--gold)}
  nav svg{width:23px; height:23px; fill:none; stroke:currentColor;
          stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
</style>
</head>
<body>

<header><h1>Trust Page</h1><p>Quét mã QR bên cạnh tượng</p></header>

<main>
  <div class="panel" id="pScan" data-p="scan">
    <div id="camWrap"><video id="cam" playsinline muted></video><div id="frame"></div></div>
    <div id="scanMsg"></div>
  </div>
  <div class="panel" id="pIntro"  data-p="intro"></div>
  <div class="panel" id="pHist"   data-p="hist"></div>
  <div class="panel" id="pTemple" data-p="temple"></div>
</main>

<nav id="nav"></nav>

<script src="lib/jsQR.js"></script>
<script>
"use strict";

const ICON = {
  scan:  '<path d="M3 8V5.5A2.5 2.5 0 0 1 5.5 3H8M16 3h2.5A2.5 2.5 0 0 1 21 5.5V8M21 16v2.5a2.5 2.5 0 0 1-2.5 2.5H16M8 21H5.5A2.5 2.5 0 0 1 3 18.5V16"/><path d="M3.5 12h17"/>',
  intro: '<path d="M6.5 3h7L18 7.5V21h-11.5z"/><path d="M9.5 12.5h5M9.5 16.5h5"/>',
  hist:  '<path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1M3.2 4.4v4.2h4.2"/><path d="M12 7.6V12l3 1.8"/>',
  temple:'<path d="M12 21.2s6.8-6 6.8-10.8a6.8 6.8 0 1 0-13.6 0C5.2 15.2 12 21.2 12 21.2z"/><circle cx="12" cy="10.2" r="2.4"/>'
};
const TABS = [["scan","Quét QR"],["intro","Giới thiệu"],["hist","Lịch sử"],["temple","Thông tin chùa"]];

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s)
  .replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nl = s => esc(s).replace(/\n/g, "<br>");

/* ---------------------------------------------------------------------------
   Renderer của cấu trúc nội dung. Một `section` = { title, body[] }.
   Mỗi phần tử trong `body` tự khai kiểu bằng chính kiểu dữ liệu của nó:

     "chuỗi"                     -> đoạn văn
     ["nội dung"]                -> gạch đầu dòng
     ["thuật ngữ", "giải thích"] -> gạch đầu dòng có thuật ngữ in đậm
     {quote, nghia?}             -> khối trích dẫn, `nghia` là phần dịch bên dưới

   Các gạch đầu dòng liền nhau tự gom thành một <ul>. Thứ tự trong `body` là thứ
   tự hiển thị, nên đoạn văn đặt sau trích dẫn vẫn ra sau — không bị ép thứ tự.
   --------------------------------------------------------------------------- */
function renderBody(body) {
  let html = "", bullets = [];
  const flush = () => { if (bullets.length) { html += `<ul>${bullets.join("")}</ul>`; bullets = []; } };

  for (const b of body || []) {
    if (Array.isArray(b)) {
      bullets.push(b.length > 1
        ? `<li><b>${esc(b[0])}</b> — ${esc(b[1])}</li>`
        : `<li>${esc(b[0])}</li>`);
      continue;
    }
    flush();
    if (typeof b === "string") html += `<p>${nl(b)}</p>`;
    else if (b && b.quote) html += `<blockquote>${nl(b.quote)}` +
      (b.nghia ? `<i>${nl(b.nghia)}</i>` : "") + `</blockquote>`;
  }
  flush();
  return html;
}

const renderSections = list => (list || [])
  .map(s => `<div class="sec"><h2>${esc(s.title)}</h2>${renderBody(s.body)}</div>`).join("");

/* ------------------------------------------------------------------ lịch sử */
const HKEY = "buddha.history";
const readHist = () => { try { return JSON.parse(localStorage.getItem(HKEY)) || [] } catch { return [] } };
function addHist(id) {
  const h = readHist().filter(x => x.id !== id);      // quét lại thì đẩy lên đầu, không nhân bản
  h.unshift({ id, t: Date.now() });
  try { localStorage.setItem(HKEY, JSON.stringify(h.slice(0, 100))) } catch {}
}

/* -------------------------------------------------------------------- render */
let DATA = { temple: {}, buddhas: {} };
let curId = null;

function renderIntro() {
  const d = DATA.buddhas[curId];
  if (!d) {
    $("#pIntro").innerHTML =
      '<p class="empty">Chưa quét tượng nào.<br>Sang tab <b>Quét QR</b> để bắt đầu.</p>';
    return;
  }
  const sub = [d.han, d.sanskrit].filter(Boolean).join(" · ");
  $("#pIntro").innerHTML =
    `<div class="ihead"><b>${esc(d.name)}</b><span>${esc(sub)}</span></div>` +
    `<video id="vid" src="${esc(d.video)}" playsinline controls preload="metadata"></video>` +
    `<div id="introBody"><div class="inner">${renderSections(d.sections)}</div></div>`;
  $("#vid").play().catch(() => {});   // Safari chặn autoplay có tiếng -> nút play sẵn có
}

function renderHist() {
  const h = readHist().filter(x => DATA.buddhas[x.id]);   // bỏ id đã gỡ khỏi content.json
  $("#pHist").innerHTML = '<div class="inner">' + (h.length
    ? h.map(x => {
        const d = DATA.buddhas[x.id];
        return `<button class="item" data-id="${esc(x.id)}"><b>${esc(d.name)}</b>` +
               `<span>${esc(d.summary || d.han || "")}</span>` +
               `<time>${new Date(x.t).toLocaleString("vi-VN")}</time></button>`;
      }).join("")
    : '<p class="empty">Chưa quét tượng nào.</p>') + '</div>';
}

function renderTemple() {
  const t = DATA.temple || {};
  $("#pTemple").innerHTML = '<div class="inner">' +
    `<div class="card"><b>${esc(t.name)}</b><span>${esc(t.address)}</span>` +
    (t.maps ? `<a href="${esc(t.maps)}" target="_blank" rel="noopener">Chỉ đường</a>` : "") +
    `</div>${renderSections(t.sections)}</div>`;
}

/* -------------------------------------------------------------- chuyển tab */
function show(k) {
  document.querySelectorAll(".panel").forEach(p => p.classList.toggle("on", p.dataset.p === k));
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.t === k));
  if (k !== "intro") { const v = $("#vid"); if (v) v.pause(); }
  if (k === "hist") renderHist();
  k === "scan" ? startCam() : stopCam();      // rời tab quét là tắt camera ngay
}

function openBuddha(id) {
  if (!DATA.buddhas[id]) return false;
  curId = id;
  addHist(id);
  renderIntro();
  show("intro");
  return true;
}

/* ------------------------------------------------------------------ camera */
const cam = $("#cam"), msg = $("#scanMsg");
const cv = document.createElement("canvas"), ctx = cv.getContext("2d", { willReadFrequently: true });
let stream = null, raf = 0;

const say = (title, sub) => msg.innerHTML = `<b>${esc(title)}</b>${esc(sub || "")}`;

async function startCam() {
  if (stream) return;
  if (!window.isSecureContext) {
    return say("Camera cần HTTPS",
      "Trang đang chạy qua http nên trình duyệt chặn camera. Xem mục “Chạy local” trong plan.");
  }
  if (!navigator.mediaDevices?.getUserMedia) {
    return say("Trình duyệt không hỗ trợ camera", "Thử Safari hoặc Chrome bản mới.");
  }
  say("Đang mở camera…", "");
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } } });
  } catch (e) {
    return say("Không mở được camera", e.name === "NotAllowedError"
      ? "Bạn đã từ chối quyền camera. Vào Cài đặt trình duyệt để bật lại."
      : e.message);
  }
  cam.srcObject = stream;
  await cam.play().catch(() => {});
  say("Đưa mã QR vào khung", "");
  raf = requestAnimationFrame(tick);
}

function stopCam() {
  cancelAnimationFrame(raf); raf = 0;
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  cam.srcObject = null;
}

function tick() {
  raf = requestAnimationFrame(tick);
  if (cam.readyState < 2 || !cam.videoWidth) return;

  // ponytail: hạ về 480px bề ngang cho đủ nhanh trên máy yếu. QR in quá nhỏ hoặc ở xa
  // có thể không bắt được -> nâng số này lên nếu quét thực tế hay trượt.
  const w = 480, h = Math.round(cam.videoHeight / cam.videoWidth * w);
  cv.width = w; cv.height = h;
  ctx.drawImage(cam, 0, 0, w, h);

  const code = jsQR(ctx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: "dontInvert" });
  if (!code) return;
  if (!openBuddha(idFrom(code.data))) say("Mã QR không thuộc hệ thống", code.data.slice(0, 60));
}

// QR chứa URL dạng https://trustpage.info/?v=dia-tang -> lấy v. Nếu chỉ chứa mỗi id thì
// lấy nguyên. Nhờ vậy một mã dùng được cả 2 đường: quét trong app, và quét bằng camera
// hệ thống (máy mở thẳng URL).
function idFrom(text) {
  try { return new URL(text).searchParams.get("v") || "" } catch { return text.trim() }
}

/* ---------------------------------------------------------------- khởi động */
nav.innerHTML = TABS.map(([k, label]) =>
  `<button data-t="${k}"><svg viewBox="0 0 24 24">${ICON[k]}</svg>${label}</button>`).join("");
nav.onclick = e => { const b = e.target.closest("button"); if (b) show(b.dataset.t); };
$("#pHist").onclick = e => { const b = e.target.closest(".item"); if (b) openBuddha(b.dataset.id); };

document.addEventListener("visibilitychange", () => {
  // Khoá máy hoặc chuyển app -> nhả camera, đừng để đèn báo camera sáng dai.
  if (document.hidden) stopCam();
  else if ($("nav button.on")?.dataset.t === "scan") startCam();
});

(async function main() {
  try {
    const r = await fetch("content.json", { cache: "no-cache" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    DATA = await r.json();
  } catch (e) {
    document.querySelector("main").innerHTML =
      `<div class="panel on"><p class="empty">Không tải được nội dung.<br>${esc(e.message)}</p></div>`;
    return;
  }

  renderTemple();
  renderIntro();

  // Vào bằng link /?v=<id> (quét bằng camera hệ thống) -> thẳng tab Giới thiệu.
  const fromUrl = new URLSearchParams(location.search).get("v");
  if (!(fromUrl && openBuddha(fromUrl))) show("scan");
})();
</script>
</body>
</html>
